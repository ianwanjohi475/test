<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icons/icon48.png" width="20" height="20" alt="" />
        <span>Persona media</span>
      </div>
      <label class="switch" title="Intercept clicks on upload fields">
        <input type="checkbox" id="armed" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <p class="sub" id="armedLabel">Intercepting upload fields</p>

    <div class="add">
      <button id="addBtn" class="primary">+ Add images or videos</button>
      <input id="file" type="file" accept="image/*,video/*" multiple hidden />
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>
      No media yet. Add images or videos, then click any upload button on a
      website to drop them in.
    </p>

    <script src="db.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
