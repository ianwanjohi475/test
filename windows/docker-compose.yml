# ☁️📱 Cloud Phone — Windows (Docker Desktop / WSL2) edition
#
# A real-phone-shaped ANDROID 11 device. Android 11 is the lightest,
# fastest image of this family — 14 was hanging ("Process system isn't
# responding") under software rendering; 11 flies and runs current apps.
#
#   Start:   docker compose up -d      (run inside this "windows" folder)
#   Open:    http://localhost:6080     <- the phone appears in your browser
#
# Ports 5555/5556 are avoided on purpose (you said they're taken):
#   6080 -> browser screen (noVNC)
#   5557 -> ADB from your PC (optional)

services:
  cloudphone:
    image: budtmo/docker-android:emulator_11.0
    container_name: cloudphone
    privileged: true
    restart: unless-stopped
    devices:
      - /dev/kvm                     # hardware acceleration = smooth, no crashes
    environment:
      # Real phone profile (hardware traits), with an explicit LIGHTWEIGHT
      # portrait panel: 720x1600 = modern 20:9 phone shape with few pixels —
      # the container renders in SOFTWARE, fewer pixels = fast. "Nexus 5" is
      # the profile every docker-android version supports; the panel is set
      # explicitly below so the profile's own size doesn't matter.
      # Changing any of these recreates the phone: bash windows/factory-reset.sh
      - EMULATOR_DEVICE=Nexus 5
      - EMULATOR_NO_SKIN=true
      - SCREEN_WIDTH=720
      - SCREEN_HEIGHT=1600
      - SCREEN_DEPTH=24
      - WEB_VNC=true                         # phone screen in the browser
      - EMULATOR_DATA_PARTITION=8g           # 8 GB app storage (default is only 550 MB!)
      # Working cameras: back = 3D virtual scene, front = emulated video.
      # Camera apps (WhatsApp video, camera app, QR scanners) work, no crash.
      # lcd_density 320 sizes the UI right for a 720-wide panel.
      # -memory/-cores: give the phone 2.5 GB RAM and 4 CPU cores so the
      # system doesn't ANR (lower -cores to 2 on a 4-core PC).
      - EMULATOR_ADDITIONAL_ARGS=-camera-back virtualscene -camera-front emulated -prop qemu.sf.lcd_density=320 -memory 2560 -cores 4
    ports:
      - "6080:6080"                  # browser UI
      - "5557:5555"                  # ADB, remapped off busy 5555 -> 5557
      - "127.0.0.1:5038:5037"        # emulator's own adb SERVER (for scrcpy) —
                                     # host 5038 avoids clashing with your PC's
                                     # own adb on 5037; localhost-only.
      - "127.0.0.1:27183:27183"      # scrcpy tunnel: scrcpy asks the container's
                                     # adb to "adb forward" the video/control
                                     # socket on this port; it must be published
                                     # or scrcpy exits with "Server connection
                                     # failed". Localhost-only.
    volumes:
      - phone-data:/home/androidusr  # apps & settings survive restarts
    shm_size: 2g                     # bigger shared memory = fewer app crashes
    healthcheck:
      test: ["CMD-SHELL", "adb shell getprop sys.boot_completed | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # "Hardware look": the phone screen inside a realistic device body,
  # served at http://localhost:6081
  phoneframe:
    image: nginx:alpine
    container_name: cloudphone-frame
    restart: unless-stopped
    volumes:
      - ./phone-frame:/usr/share/nginx/html:ro
    ports:
      - "6081:80"

volumes:
  phone-data:
