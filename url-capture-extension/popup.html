<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px; margin: 0; padding: 10px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 13px; margin: 0 0 8px; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
      button {
        font: inherit; padding: 4px 10px; border-radius: 4px;
        border: 1px solid #8884; background: transparent; cursor: pointer; color: inherit;
      }
      button:hover { background: #8882; }
      .count { color: #888; margin-left: auto; }
      .hint { color: #888; font-size: 11px; margin-top: 8px; }
      a { color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>URL &amp; Response Capture</h1>
    <div class="row">
      <button id="toggle">Pause</button>
      <button id="clear">Clear</button>
      <span class="count" id="count">0</span>
    </div>
    <div class="row">
      <button id="export-json">Export JSON</button>
      <button id="export-csv">Export CSV</button>
    </div>
    <div class="hint">
      This popup logs URLs, methods and status codes across all tabs. For full
      <b>response bodies</b>, open DevTools (F12) → the <b>URL Capture</b> panel.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
