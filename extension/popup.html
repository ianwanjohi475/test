<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>URL Extractor & Responder</title>
  </head>
  <body>
    <header>
      <h1>URL Extractor &amp; Responder</h1>
      <div class="toolbar">
        <input id="filter" type="search" placeholder="Filter URLs…" autocomplete="off" />
        <button id="rescan" title="Re-scan the page">Rescan</button>
        <button id="copy" title="Copy all visible URLs">Copy</button>
      </div>
      <div id="summary" class="summary"></div>
    </header>

    <main id="list" class="list"></main>

    <div id="detail" class="detail hidden">
      <div class="detail-head">
        <button id="detail-back">&larr; Back</button>
        <span id="detail-url" class="detail-url"></span>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
